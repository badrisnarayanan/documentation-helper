[project]
name = "documentation-helper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Badri Narayanan S", email = "s.badrinarayanan791@email.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "black>=26.10.1",
    "certifi>=2026.10.23",
    "fastapi>=0.162.0",
    "firecrawl-py>=4.54.0",
    "isort>=9.0.2",
    "jinja2>=3.1.6",
    "langchain>=1.4.8",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-pinecone>=0.2.13",
    "langchain-tavily>=0.2.18",
    "langchainhub>=0.1.21",
    "langsmith>=0.14.17",
    "nltk>=3.10.4",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
    "streamlit-chat>=0.1.1",
    "tiktoken>=0.14.0",
    "tqdm>=4.70.1",
    "unstructured>=0.27.36",
    "uvicorn>=0.54.0",
]

[project.scripts]
documentation-helper = "documentation_helper:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
